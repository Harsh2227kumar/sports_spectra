<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f3f3; }
    </style>
</head>
<body class="p-6 md:p-12 text-gray-800">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-orange-500 p-6 text-white text-center">
            <h1 class="text-3xl font-black">Admin Panel</h1>
            <p class="text-sm opacity-90 mt-1">Add winning bids during the auction</p>
        </div>
        
        <form id="auctionForm" class="p-8 flex flex-col gap-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Select Team</label>
                    <select id="team" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm font-medium focus:outline-none focus:border-orange-500" required>
                        <option value="TEAM 1">TEAM 1</option>
                        <option value="TEAM 2">TEAM 2</option>
                        <option value="TEAM 3">TEAM 3</option>
                        <option value="TEAM 4">TEAM 4</option>
                        <option value="TEAM 5">TEAM 5</option>
                        <option value="TEAM 6">TEAM 6</option>
                        <option value="TEAM 7">TEAM 7</option>
                        <option value="TEAM 8">TEAM 8</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Player Role</label>
                    <select id="role" class="w-full bg-gray-100 border border-gray-200 rounded-lg p-3 text-sm font-medium focus:outline-none" disabled>
                        <option value="Player">Player</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Player Name</label>
                <input type="text" id="playerName" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm font-medium focus:outline-none focus:border-orange-500" placeholder="e.g. John Doe" required>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
                <div class="col-span-2 md:col-span-1">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Gender</label>
                    <select id="gender" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm font-medium focus:outline-none focus:border-orange-500" required>
                        <option value="M">M</option>
                        <option value="F">F</option>
                    </select>
                </div>
                <div class="col-span-2 md:col-span-1">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Year</label>
                    <input type="text" id="year" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm font-medium focus:outline-none focus:border-orange-500" placeholder="e.g. 2nd" required>
                </div>
                <div class="col-span-2 md:col-span-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Section</label>
                    <input type="text" id="section" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm font-medium focus:outline-none focus:border-orange-500" placeholder="e.g. A" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Sports Played</label>
                <input type="text" id="sports" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm font-medium focus:outline-none focus:border-orange-500" placeholder="e.g. Cricket, Football" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Bid Amount (₹)</label>
                    <input type="number" id="bidAmount" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm font-medium focus:outline-none focus:border-orange-500" placeholder="e.g. 1000" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Photo URL (Optional)</label>
                    <input type="text" id="photoUrl" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm font-medium focus:outline-none focus:border-orange-500" placeholder="https://...">
                </div>
            </div>

            <button type="submit" class="mt-4 bg-orange-500 text-white font-bold text-lg py-4 rounded-xl hover:bg-orange-600 transition shadow-lg">
                Save Bid to Team
            </button>
            <p id="successMsg" class="text-green-600 font-bold text-center text-sm hidden mt-2">Player added successfully!</p>
        </form>
    </div>

    <!-- View List -->
    <div class="max-w-2xl mx-auto mt-8 bg-white p-6 rounded-2xl shadow-xl">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">Recent Entries</h2>
            <button onclick="clearData()" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded-full font-bold hover:bg-red-200 transition">Clear All Data</button>
        </div>
        <div id="playerList" class="flex flex-col gap-2 text-sm max-h-[300px] overflow-y-auto">
            <!-- Populated via JS -->
        </div>
    </div>

    <script>
        document.getElementById('auctionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const player = {
                id: Date.now(),
                team: document.getElementById('team').value,
                role: document.getElementById('role').value,
                name: document.getElementById('playerName').value,
                gender: document.getElementById('gender').value,
                year: document.getElementById('year').value,
                section: document.getElementById('section').value,
                sports: document.getElementById('sports').value,
                bidAmount: document.getElementById('bidAmount').value,
                photoUrl: document.getElementById('photoUrl').value || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(document.getElementById('playerName').value) + '&background=random'
            };

            const players = JSON.parse(localStorage.getItem('auctionPlayers') || '[]');
            
            // If Captain or Vice Captain, remove existing one for that team
            if(player.role !== 'Player') {
                const existingIndex = players.findIndex(p => p.team === player.team && p.role === player.role);
                if(existingIndex > -1) players.splice(existingIndex, 1);
            }

            players.push(player);
            localStorage.setItem('auctionPlayers', JSON.stringify(players));

            const msg = document.getElementById('successMsg');
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3000);
            
            this.reset();
            renderList();
        });

        function clearData() {
            if(confirm("Are you sure you want to delete all auction data?")) {
                localStorage.removeItem('auctionPlayers');
                renderList();
            }
        }

        function renderList() {
            const players = JSON.parse(localStorage.getItem('auctionPlayers') || '[]');
            const list = document.getElementById('playerList');
            list.innerHTML = players.length === 0 ? '<p class="text-gray-400 italic">No entries yet.</p>' : '';
            
            // Reverse so newest is on top
            players.slice().reverse().forEach(p => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-3 bg-gray-50 rounded border border-gray-100';
                div.innerHTML = `
                    <div><span class="font-bold">${p.name}</span> <span class="text-xs text-gray-500">(${p.role})</span></div>
                    <div class="text-right">
                        <div class="font-bold text-orange-600">₹${p.bidAmount}</div>
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-widest">${p.team}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // Init
        renderList();
    </script>
</body>
</html>
